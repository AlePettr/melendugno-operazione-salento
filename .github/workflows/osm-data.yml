name: Scarica dati OpenStreetMap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/osm-data.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica edifici e strade da Overpass
        run: |
          mkdir -p data
          BB='40.2667,18.3314,40.2751,18.3422'
          Q="[out:json][timeout:90];(way[\"building\"]($BB);way[\"highway\"]($BB););out geom;"
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://lz4.overpass-api.de/api/interpreter; do
            for i in 1 2 3; do
              echo "Provo $u (tentativo $i)"
              if curl -sS -f -m 150 --data-urlencode "data=$Q" "$u" -o data/tmp.json \
                 && python3 -c "import json;d=json.load(open('data/tmp.json'));assert len(d['elements'])>50;print(len(d['elements']),'elementi')"; then
                mv data/tmp.json data/melendugno.json
                break 2
              fi
              sleep 15
            done
          done
          test -f data/melendugno.json
      - name: Salva nella repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/melendugno.json
          git commit -m "Aggiorna dati OpenStreetMap di Melendugno" || exit 0
          git push
